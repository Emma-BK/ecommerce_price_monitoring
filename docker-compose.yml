version: '3.8'

services:
  api:
    build: .
    container_name: ecom_price_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=sqlite:///ecommerce_prices.db
      - API_HOST=0.0.0.0
      - API_DEBUG_MODE=False
    # CMD pour lancer l'API (déjà définie dans le Dockerfile, mais modifiable ici si besoin)
    # command: uvicorn api_predictions:app --host 0.0.0.0 --port 8000

  # Optionnel : Postgresql pour la production
