  #     POSTGRES_PASSWORD: superSecret
  #     POSTGRES_DB: ecommerce_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #
  # Optionnel : Scraper Job et ML Training (en tâche de fond séparée de l'API)
  #
  # ml_worker:
  #   build: .
  #   container_name: ecom_ml_worker
  #   restart: always
